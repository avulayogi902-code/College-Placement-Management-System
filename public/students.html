<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - College Placement Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Student Management</h1>
    <p>Add, update, view and delete student details</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="students.html">Students</a>
    <a href="companies.html">Companies</a>
    <a href="drives.html">Placement Drives</a>
    <a href="applications.html">Applications</a>
</nav>

<main class="container">
    <h2>Student Details</h2>

    <form id="studentForm">
        <input type="hidden" id="student_id">

        <label>Student Name</label>
        <input type="text" id="student_name" placeholder="Enter student name" required>

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter email" required>

        <label>Phone Number</label>
        <input type="text" id="phone" placeholder="Enter phone number">

        <label>Department</label>
        <select id="department" required>
            <option value="">Select Department</option>
            <option value="CSE">CSE</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="MECH">MECH</option>
            <option value="CIVIL">CIVIL</option>
            <option value="IT">IT</option>
        </select>

        <label>Graduation Year</label>
        <input type="number" id="graduation_year" placeholder="Example: 2027" required>

        <label>CGPA</label>
        <input type="number" id="cgpa" placeholder="Enter CGPA" min="0" max="10" step="0.01" required>

        <button type="submit" id="studentSubmitBtn">Save Student</button>
        <button type="button" onclick="resetStudentForm()" class="reset-btn">Clear</button>
    </form>

    <h2>Student List</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Department</th>
                    <th>Graduation Year</th>
                    <th>CGPA</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentTableBody"></tbody>
        </table>
    </div>
</main>

<footer>
    <p>© 2026 College Placement Management System</p>
</footer>

<script src="script.js"></script>
</body>
</html>
